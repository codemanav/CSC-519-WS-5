---
- name: Apply Security Patches to All Hosts
  hosts: myserver
  become: yes

  tasks:
    - name: Update package list
      apt:
        update_cache: yes

    - name: Upgrade installed packages
      apt:
        upgrade: yes


    - name: Get list of security updates
      shell: apt list --upgradable 2>/dev/null | grep -i security | awk -F/ '{print $1}'
      register: security_updates
      changed_when: False

    - name: Apply all security updates
      apt:
        name: "{{ item }}"
        state: latest
      loop: "{{ security_updates.stdout_lines }}"
      when: security_updates.stdout_lines

    - name: Allow HTTP Port
      ufw:
        rule: allow
        port: '80'
        proto: tcp
