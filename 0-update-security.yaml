---
- name: Apply security updates on all hosts
  hosts: all
  become: yes

  tasks:
    - name: Update apt package cache
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600   

    - name: Upgrade all packages to latest version
      ansible.builtin.apt:
        upgrade: dist
        autoremove: yes
        autoclean: yes

    - name: Reboot if needed (kernel updates, etc.)
      ansible.builtin.reboot:
        msg: "Rebooting after security updates"
        connect_timeout: 5
        reboot_timeout: 600
        pre_reboot_delay: 0
        post_reboot_delay: 30
        test_command: whoami
      when: ansible_facts['os_family'] == "Debian"
