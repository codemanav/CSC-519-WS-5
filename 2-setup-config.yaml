---
- name: Setup Configuration
  hosts: dbserver
  become: yes

  vars:
    mysql_password: "{{ mysql_password_var }}"

  tasks:

    - name: Copy Table Creation SQL Schema file to remote host
      copy:
        src: db_schema.sql
        dest: /tmp/db_schema.sql

    - name: Copy Loading of Data SQL Script to remote host
      copy:
        src: load_data.sql
        dest: /tmp/load_data.sql

    - name: Copy SQL file to remote host
      copy:
        src: db_schema.sql
        dest: /tmp/db_schema.sql

    - name: Expose port 80 with iptables
      shell:
        "sudo iptables -I INPUT -p tcp -m tcp --dport 80 -j ACCEPT"

    - name: Install MySQL Server on Host Machine
      apt:
        name: mysql-server
        state: present

    - name: Install MySQL Python package on Host Machine
      apt:
        name: python3-mysqldb
        state: present

    - name: Start & Enable MySQL Server
      service:
        name: mysql
        state: started
        enabled: yes

    - name: Update MySql 'root' password for all root accounts
      become: yes
      mysql_user:
        name: root
        host: "{{ item }}"
        password: "{{ mysql_password_var }}"
        login_user: root
        login_password: "{{ mysql_password_var }}"
        login_unix_socket: /var/run/mysqld/mysqld.sock
        check_implicit_admin: yes
        priv: "*.*:ALL,GRANT"
      with_items:
        - "{{ ansible_hostname }}"
        - 127.0.0.1
        - ::1
        - localhost
        - 'vclvm178-252.vcl.ncsu.edu'

    - name: Create MySQL Database - 'coordinates'
      mysql_db:
        name: coordinates
        state: present
        login_user: root
        login_password: "{{ mysql_password_var }}"
      become: yes

    - name: Create table 'cartesian_coordinate'
      mysql_db:
        name: coordinates
        state: import
        target: /tmp/db_schema.sql
        login_user: root
        login_password: "{{ mysql_password_var }}"

    - name: Copy 'rand-x-y-data.csv' to remote host
      copy:
        src: rand-x-y-data.csv
        dest: /var/lib/mysql-files/rand-x-y-data.csv

    - name: Insert Data from 'rand-x-y-data.csv' into 'cartesian_coordinate' Table
      become: yes
      mysql_db:
        name: coordinates
        state: import
        target: /tmp/load_data.sql
        login_user: root
        login_password: "{{ mysql_password_var }}"

    - name: Expose port 3306 with iptables
      shell:
        "sudo iptables -I INPUT -p tcp -m tcp --dport 3306 -j ACCEPT"




