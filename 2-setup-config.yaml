---

- name: Setup the SQL stuff in VM1
  hosts: myserver
  become: yes
  vars_files:
    - vars.yaml


  tasks:
    - name: Setup Mysql
      apt:  
        name: 
          - mysql-server
          - mysql-client
          - python3-mysqldb
        state: latest
      become: yes

    - name: Start the msql server
      service:
        name: mysql
        state: started

    - name: Create the mysql db
      mysql_db:
        name: "{{ db_name }}"
        state: present
      environment:
        MYSQL_HOST: "{{ db_host }}"
        MYSQL_PORT: "{{ db_port }}"

    - name: Expose port 3306 with iptables
      shell: "sudo iptables -I INPUT -p tcp -m tcp --dport 3306 -j ACCEPT"

    - name: Set MySQL bind-address
      lineinfile:
        path: /etc/mysql/mysql.conf.d/mysqld.cnf 
        regexp: '^bind-address'
        line: 'bind-address = 0.0.0.0' 
      notify: Restart mysql  


    - name: Create user
      mysql_user:
        name: "{{ db_user }}"
        password: "{{ db_password }}"
        host: "{{app_user_host}}"
        login_user: root
        login_password: "{{ mysql_root_password }}"
        priv: '*.*:ALL'
        state: present

    - name: Create table if it doesn't exist
      mysql_query:
        login_db: "{{ db_name }}"
        login_user: root
        login_password: "{{ mysql_root_password }}"
        query: 
          - CREATE TABLE IF NOT EXISTS {{table_name}} (x float, y float)

    - name: Paste data from image to vcl
      copy: 
        src: "{{ csv_file }}"
        dest: /var/lib/mysql-files/

    - name: Populate MySQL table with CSV data
      mysql_query:
        login_user: root
        login_password: "{{ mysql_root_password }}"
        login_db: "{{ db_name }}"
        query:
          - "LOAD DATA INFILE '/var/lib/mysql-files/rand-x-y-data.csv' INTO TABLE {{ table_name }} FIELDS TERMINATED BY ',' IGNORE 1 LINES;"

- name: Setup APP and NPM
  hosts: myserver2
  become: yes
  vars_files:
    - vars.yaml

  tasks:
    - name: Install NodeJS and npm and nginx
      apt:
        name: 
          - nodejs
          - npm
          - nginx
        state: latest

    - name: Delete existing myapp directory 
      command: rm -rf /var/myapp
      become: yes

    - name: make myapp directory
      command: mkdir -p /var/myapp

    - name: Copy the node.js app into the myapp directory
      copy:
        src: ./app/
        dest: /var/myapp/

    - name: Install stuff for node app
      command: npm install 
      args:
        chdir: /var/myapp/

    - name: Expose port 3000 with iptables
      shell: "sudo iptables -I INPUT -p tcp -m tcp --dport 3000 -j ACCEPT"

    - name: Reroute to port 80 using iptables
      shell:  "sudo iptables -t nat -A PREROUTING -p tcp --dport 80 -j REDIRECT --to-port 3000"

    - name: Run the node.js app
      command: node /var/myapp/app.js --db_host={{ db_host}}  --db_user={{ db_user}}  --db_pass={{ db_password }} --db={{ db_name }} --db_port={{ db_port }}
      async: 1000
      poll: 0

    - name: Check if the webserver is running and can be accessed at port 80
      uri:
        url: "http://localhost:80/"  
        return_content: yes 
      register: web_page_response
      ignore_errors: yes

    - name: Display The Success Message if the webserver is running
      debug: 
        msg: "Webserver is up at port 80!!!!!!"
      when: web_page_response.status == 200


    - name: Fail if status code is not 200
      fail:
        msg: "Web page did not return a status code of 200."
      when: web_page_response.status != 200

