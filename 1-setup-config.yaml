- name: NodeJS and Redis Setup on VM1 and VM2
  hosts: myserver
  become: yes
  vars:
    redis_password: "{{ lookup('env', 'DB_PASS') }}"
  environment:
    REDIS_PASS: "{{ lookup('env', 'DB_PASS') }}"

  tasks:
    - name: Remove older versions of Node.js and npm
      apt:
        name:
          - nodejs
          - npm
        state: absent
        
    # NodeJS and npm setup
    - name: Install NodeJS and npm
      apt:
        name:
          - nodejs
          - npm
        state: latest

    # Install Redis server
    - name: Install Redis Server
      apt:
        name: redis-server
        state: latest

    # Configure Redis password in the Redis config
    - name: Configure Redis password
      lineinfile:
        path: /etc/redis/redis.conf
        regexp: '^# requirepass'
        line: 'requirepass {{ redis_password }}'

    # Restart Redis to Apply Changes
    - name: Restart Redis to Apply Changes
      systemd:
        name:  redis-server
        state: restarted

    # Export Redis password as an environment variable permanently
    - name: Add REDIS_PASS to .bashrc for persistence
      lineinfile:
        path: /root/.bashrc  # Modify this path if a different user needs access
        line: 'export REDIS_PASS={{ redis_password }}'

     # Create destination directory if it does not exist
    - name: Create destination directory
      ansible.builtin.file:
        path: /var/www/db_file
        state: directory

    # Copy CSV file to remote machine
    - name: Copy CSV file to remote machine
      copy:
        src: rand-x-y-data.csv
        dest: /var/www/db_file/rand-x-y-data.csv

    # Check if CSV file exists
    - name: Check if CSV file exists
      stat:
        path: /var/www/db_file/rand-x-y-data.csv
      register: csv_file

    # Copy Python script to populate Redis database
    - name: Copy Python script to remote machine
      copy:
        src: Data/populate_redis.py
        dest: /var/www/db_file/populate_redis.py

    - name: Install pip3
      apt:
        name: python3-pip
        state: latest
      become: yes

    # Install Redis Python client
    - name: Install redis-py
      pip:
        name: redis
        state: latest

    # Run Python script to populate Redis from the CSV
    - name: Run Python script to populate Redis from CSV
      command: python3 /var/www/db_file/populate_redis.py
      when: csv_file.stat.exists

- name: NodeJS App Installation and Running
  hosts: vm1
  become: yes
  vars:
    redis_password: "{{ lookup('env', 'DB_PASS') }}"
  environment:
    REDIS_PASS: "{{ lookup('env', 'DB_PASS') }}"
  tasks:
      
     # Copy Python script to find x,y distance in Redis database and accept an api call
    - name: Copy Node js script to remote machine
      copy:
        src: Data/app.js
        dest: /var/www/db_file/app.js
    
    - name: Copy Node js script to remote machine
      copy:
        src: Data/package.json
        dest: /var/www/db_file/package.json
      
   # Install Nginx
    - name: Install Nginx
      apt:
        name: nginx
        state: present

    # Allow Nginx through the firewall
    - name: Allow Nginx Full profile through the firewall
      ufw:
        rule: allow
        name: 'Nginx Full'

    # Kill any existing process running on port 3000 to free the port
    - name: Kill existing process running on port 3000
      shell: |
        lsof -t -i tcp:3000 | xargs kill -9 || true  # Ignore errors if no process is found
      ignore_errors: yes
      
    - name: Find Nginx configuration files in sites-available
      find:
        paths: /etc/nginx/sites-available/
        patterns: "*"
        recurse: yes
      register: available_configs

    - name: Find Nginx configuration links in sites-enabled
      find:
        paths: /etc/nginx/sites-enabled/
        recurse: yes
        file_type: link
      register: enabled_links

    - name: Remove symbolic links in sites-enabled
      file:
        path: "{{ item.path }}"
        state: absent
      with_items: "{{ enabled_links.files }}"

    - name: Delete configuration files in sites-available
      file:
        path: "{{ item.path }}"
        state: absent
      with_items: "{{ available_configs.files }}"
    
    - name: Copy Nginx configuration
      template:
        src: nginx.conf
        dest: /etc/nginx/sites-available/my_app
    
    - name: Reload Nginx
      systemd:
        name: nginx
        state: reloaded
        
    - name: Enable Nginx configuration
      file:
        src: /etc/nginx/sites-available/my_app
        dest: /etc/nginx/sites-enabled/my_app
        state: link

    - name: Reload Nginx
      systemd:
        name: nginx
        state: reloaded
    
    - name: Open port 80 in UFW
      ufw:
        rule: allow
        port: '80'
        proto: tcp


    - name: Ensure Redis is running
      systemd:
        name: redis
        state: started

    # Install npm packages
    - name: Install npm packages
      command:
        cmd: npm install
        chdir: /var/www/db_file/

    # Install specific version of Redis package for Node.js
    - name: Install Redis package for Node.js
      npm:
        name: redis
        version: '3.0.0'  # specify the version here
        path: /var/www/db_file/  # Make sure this path points to your Node.js application root
        state: present

  # Open port 80 in the firewall using iptables
    - name: Expose port 80 with iptables
      shell: 
        "sudo iptables -I INPUT -p tcp -m tcp --dport 80 -j ACCEPT"

  # Restart nginx to apply changes
    - name: Restart Nginx
      systemd:
        name: nginx
        state: restarted

    - name: Run Node.js program in the background
      shell: nohup /usr/bin/node /var/www/db_file/app.js > /var/www/db_file/app.log 2>&1 &


